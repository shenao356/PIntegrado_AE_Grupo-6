name: Ejecutar Semana 1

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-semana-1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r AE2/requirements.txt

      - name: Limpiar salidas anteriores
        run: |
          # Borramos salidas previas para que la generacion sea siempre limpia y automatica
          rm -f src/sincronicas/datos/whatscooking_restaurants.csv
          rm -f src/sincronicas/reportes/whatscooking_restaurants.txt
          rm -f AE2/resultados/resumen_dataframe.txt

      - name: Ejecutar Semana_1SINC.ipynb
        working-directory: src/sincronicas
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Semana_1SINC.ipynb

      - name: Ejecutar EA2_Exploracion_Dataset_HuggingFace.ipynb (AE2)
        working-directory: AE2/notebooks
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA2_Exploracion_Dataset_HuggingFace.ipynb

      - name: Guardar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sincronicas/datos src/sincronicas/reportes src/sincronicas/Semana_1SINC.ipynb AE2/resultados/resumen_dataframe.txt AE2/notebooks/EA2_Exploracion_Dataset_HuggingFace.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios nuevos."
            exit 0
          fi

          git commit -m "actualizacion de resultados [skip ci]"
          git push

      - name: Limpiar archivos al cerrar
        if: always()
        run: |
          # Limpiamos entorno virtual y caches para que el cierre sea completamente limpio
          rm -rf .venv
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
